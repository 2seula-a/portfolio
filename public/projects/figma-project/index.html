<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Notive 반응형 웹앱의 PC, Tablet, Mobile UI/UX 디자인"
    />
    <title>Notive UI/UX Design</title>
    <style>
      :root {
        font-family: Inter, Pretendard, "Noto Sans KR", system-ui, sans-serif;
        color: #172033;
        background-color: #f8fafc;
        font-synthesis: none;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
      }

      button,
      a {
        font: inherit;
      }

      .viewer {
        width: min(calc(100% - 48px), 1440px);
        margin: 0 auto;
        padding: 40px 0;
      }

      .viewer__header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 32px;
        margin-bottom: 24px;
      }

      .viewer__eyebrow {
        margin: 0 0 6px;
        color: #2563eb;
        font-size: 0.8rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .viewer__title {
        margin: 0;
        color: #111827;
        font-size: clamp(1.8rem, 4vw, 3rem);
        line-height: 1.2;
      }

      .viewer__description {
        max-width: 680px;
        margin: 12px 0 0;
        color: #64748b;
        line-height: 1.7;
      }

      .viewer__controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 18px;
      }

      .viewer__button {
        min-width: 112px;
        min-height: 46px;
        padding: 10px 20px;
        border: 1px solid #dbe2ea;
        border-radius: 10px;
        color: #475569;
        background-color: #ffffff;
        font-weight: 700;
        cursor: pointer;
        transition:
          color 0.2s ease,
          border-color 0.2s ease,
          background-color 0.2s ease,
          transform 0.2s ease;
      }

      .viewer__button:hover {
        border-color: #93c5fd;
        color: #1d4ed8;
        transform: translateY(-1px);
      }

      .viewer__button[aria-pressed="true"] {
        border-color: #2563eb;
        color: #ffffff;
        background-color: #2563eb;
      }

      .viewer__button:focus-visible {
        outline: 3px solid rgba(37, 99, 235, 0.3);
        outline-offset: 3px;
      }

      .viewer__preview {
        display: flex;
        justify-content: center;
      }

      .preview-frame {
        overflow: hidden;
        width: 100%;
        max-width: 1200px;
        border: 1px solid #dbe2ea;
        border-radius: 16px;
        background-color: #ffffff;
        box-shadow: 0 16px 40px rgba(15, 23, 42, 0.1);
        transition:
          max-width 0.3s ease,
          border-radius 0.3s ease;
      }

      .preview-frame--tablet {
        max-width: 760px;
        border-radius: 20px;
      }

      .preview-frame--mobile {
        max-width: 380px;
        border-radius: 24px;
      }

      .preview-frame__bar {
        display: flex;
        align-items: center;
        gap: 7px;
        height: 38px;
        padding: 0 14px;
        border-bottom: 1px solid #e2e8f0;
        background-color: #f8fafc;
      }

      .preview-frame__dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: #cbd5e1;
      }

      .preview-frame__dot:first-child {
        background-color: #60a5fa;
      }

      .preview-frame__image {
        display: block;
        width: 100%;
        height: auto;
      }

      @media (max-width: 720px) {
        body {
          min-width: 0;
        }

        .viewer {
          width: min(calc(100% - 32px), 1440px);
          padding: 28px 0;
        }

        .viewer__header {
          align-items: flex-start;
          flex-direction: column;
          gap: 18px;
        }

        .viewer__controls {
          display: grid;
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .viewer__button {
          min-width: 0;
          padding-inline: 10px;
        }

        .preview-frame {
          border-radius: 12px;
        }

        .preview-frame--mobile {
          width: min(100%, 360px);
          border-radius: 20px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="viewer">
      <header class="viewer__header">
        <div>
          <p class="viewer__eyebrow">Responsive UI/UX Project</p>
          <h1 class="viewer__title">Notive UI/UX Design</h1>
          <p class="viewer__description">
            PC, Tablet, Mobile 버튼을 선택해 기기별 반응형 화면을 확인해 보세요.
          </p>
        </div>
      </header>

      <nav class="viewer__controls" aria-label="기기별 시안 선택">
        <button
          class="viewer__button"
          type="button"
          data-device="pc"
          data-image="pc.png"
          aria-pressed="true"
        >
          PC
        </button>
        <button
          class="viewer__button"
          type="button"
          data-device="tablet"
          data-image="tablet.png"
          aria-pressed="false"
        >
          Tablet
        </button>
        <button
          class="viewer__button"
          type="button"
          data-device="mobile"
          data-image="mobile.png"
          aria-pressed="false"
        >
          Mobile
        </button>
      </nav>

      <div class="viewer__preview" aria-live="polite">
        <div class="preview-frame preview-frame--pc">
          <div class="preview-frame__bar" aria-hidden="true">
            <span class="preview-frame__dot"></span>
            <span class="preview-frame__dot"></span>
            <span class="preview-frame__dot"></span>
          </div>
          <img
            class="preview-frame__image"
            src="pc.png"
            alt="Notive PC UI/UX 디자인 시안"
          />
        </div>
      </div>
    </main>

    <script>
      const previewFrame = document.querySelector('.preview-frame')
      const previewImage = document.querySelector('.preview-frame__image')
      const deviceButtons = document.querySelectorAll('.viewer__button')

      deviceButtons.forEach((button) => {
        button.addEventListener('click', () => {
          const deviceName = button.dataset.device
          const imagePath = button.dataset.image
          const device = button.textContent.trim()

          previewFrame.className = `preview-frame preview-frame--${deviceName}`
          previewImage.src = imagePath
          previewImage.alt = `Notive ${device} UI/UX 디자인 시안`

          deviceButtons.forEach((deviceButton) => {
            deviceButton.setAttribute('aria-pressed', String(deviceButton === button))
          })
        })
      })
    </script>
  </body>
</html>
